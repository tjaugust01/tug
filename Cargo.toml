[package]
name = "tug"
version = "0.1.0"
edition = "2024"

[dependencies]
bollard = "0.21"

ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = "0.4"
bytesize = "2"
anyhow = "1"
time = "0.3.47"
futures = "0.3.32"